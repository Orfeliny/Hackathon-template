name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.ref }}-verify
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-reports
          path: |
            reports/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

  hot-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.ref }}-hot-files
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use the base copy of the checker and the list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # A PR must not be able to weaken its own check. Files absent at base (the PR that
        # introduces the checker) keep the PR's copy.
        run: |
          for f in scripts/hot-files-check.mjs scripts/lib/hot-files.mjs .github/hot-files.txt; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$f"
            fi
          done
      - name: Check hot-file mix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/hot-files-check.mjs

  # The `secrets` job (task 18) is not in this file yet; add it to needs and to the checks below.
  gate:
    needs: [verify, hot-files]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.ref }}-gate
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require every needed job to succeed
        env:
          VERIFY: ${{ needs.verify.result }}
          HOT_FILES: ${{ needs.hot-files.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "verify=$VERIFY hot-files=$HOT_FILES event=$EVENT"
          [ "$VERIFY" = "success" ] || { echo "verify did not succeed" >&2; exit 1; }
          if [ "$HOT_FILES" = "success" ]; then exit 0; fi
          if [ "$HOT_FILES" = "skipped" ] && [ "$EVENT" != "pull_request" ]; then exit 0; fi
          echo "hot-files did not succeed" >&2
          exit 1
